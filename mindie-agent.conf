
<Location /mindie-agent/>
	Require all granted
	SetEnv SELFAUTH_SQLITE_PATH /var/lib/mindie-agent/multiuser.sqlite3
	SetEnv MINTOKEN_SQLITE_PATH /var/lib/mindie-agent/tokens.sqlite3
	SetEnv MINTOKEN_CURL_TIMEOUT 4
	SetEnv MINTOKEN_REVOKE_AFTER "7 days"
</Location>

<Directory /usr/src/mindie-agent/>
	<Files idp.php>
		Require all granted
	</Files>
</Directory>

<Directory /var/lib/mindie-agent/ >
	Require all denied
</Directory>

